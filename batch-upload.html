<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🐾 校园猫猫档案 - 批量传图工具</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .batch-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin: 12px 0;
            box-shadow: 0 4px 16px rgba(74, 59, 42, 0.06);
        }
        .batch-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text);
        }
        .batch-tip {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 14px;
            line-height: 1.5;
        }
        .cat-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #F3E9D8;
            gap: 12px;
        }
        .cat-row:last-child {
            border-bottom: none;
        }
        .cat-name {
            font-weight: 700;
            font-size: 16px;
            width: 70px;
            flex-shrink: 0;
        }
        .cat-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            color: #fff;
            flex-shrink: 0;
        }
        .cat-input {
            flex: 1;
            border: 1px dashed #E3D3B8;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            background: #FFF8F0;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .cat-input.has-file {
            border-color: #FF9F43;
            background: #FFF1DC;
            color: var(--text);
        }
        .upload-bar {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .progress {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.6;
        }
        .progress .success { color: var(--green); }
        .progress .fail { color: #D9534F; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@cloudbase/js-sdk@1.8.4/dist/index.cjs.js"></script>
</head>
<body>
    <header class="header">
        <h1 class="header-title">🐾 批量传图工具</h1>
        <p class="header-sub">电脑端一次性上传 14 只猫的照片</p>
    </header>

    <div class="batch-card">
        <div class="batch-title">📋 操作步骤</div>
        <div class="batch-tip">
            1. 选择 14 张猫咪照片(文件名对应猫名,如 <code>龙龙.jpg</code>)<br>
            2. 工具会自动按文件名匹配猫猫<br>
            3. 点击「一键批量上传到云存储」,照片会传到云存储并自动关联到档案<br>
            4. 完成后小程序和网页会立即显示新照片
        </div>
    </div>

    <div class="batch-card">
        <div class="batch-title">🐱 14 只猫(选择文件)</div>
        <div id="catRows"></div>
        <div class="upload-bar">
            <button class="btn-primary" id="btnUpload">🚀 一键批量上传</button>
            <button class="btn-ghost" id="btnReset">🔄 重置</button>
        </div>
        <div class="progress" id="progress"></div>
    </div>

    <a href="index.html" class="footer-link">← 返回档案主页</a>

    <script src="cloudbase-config.js"></script>
    <script src="batch-upload.js"></script>
</body>
</html>
