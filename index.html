<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="校园猫猫档案 - 全校猫咪的户口本,认识每一只校园猫咪">
    <title>🐾 校园猫猫档案</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <h1 class="header-title">🐾 校园猫猫档案</h1>
        <p class="header-sub">全校猫咪的「户口本」,一起来认识它们吧</p>
        <button class="admin-toggle" id="adminToggle">🔑 管理模式</button>
    </header>

    <div class="search-box">
        <input id="searchInput" class="search-input" type="search" placeholder="🔍 搜一搜猫猫名字…" autocomplete="off">
    </div>

    <nav class="filters" id="filters">
        <button class="chip active" data-filter="全部">全部</button>
        <button class="chip" data-filter="待领养">待领养</button>
        <button class="chip" data-filter="已领养">已领养</button>
        <button class="chip" data-filter="已离世">已离世</button>
    </nav>

    <div class="loading" id="loadingBox">🐾 正在加载档案…</div>
    <div class="error-box hidden" id="errorBox">数据加载失败</div>

    <main class="list" id="catList"></main>

    <div class="empty hidden" id="emptyBox">
        <div class="empty-icon">🐱</div>
        <p>没有找到符合条件的猫猫</p>
    </div>

    <footer class="footer">
        <p>🔒 为保护猫咪安全,档案不含具体出没位置</p>
        <p>🐾 校园猫猫档案 · 分享让更多人认识它们</p>
    </footer>

    <!-- 详情弹层 -->
    <div class="modal hidden" id="detailModal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <!-- 密码弹层 -->
    <div class="modal modal-narrow hidden" id="passwordModal">
        <div class="modal-content">
            <button class="modal-close" id="passwordClose">✕</button>
            <div style="padding: 20px;">
                <div class="form-title">🔑 管理模式</div>
                <p class="form-tip">输入管理员密码后可新增、编辑、删除猫猫档案</p>
                <input id="passwordInput" class="form-input" type="password" placeholder="管理员密码" autocomplete="off" style="border:1px solid #E3D3B8;">
                <div class="form-error hidden" id="passwordError"></div>
                <div class="btn-row" style="margin-top: 16px;">
                    <button class="btn-ghost" id="passwordCancel">取消</button>
                    <button class="btn-primary" id="passwordConfirm">进入管理</button>
                </div>
                <div style="margin-top: 16px; padding-top: 16px; border-top: 1px dashed #F3E9D8; font-size: 12px; color: #B8A890; line-height: 1.6;">
                    ⚙️ 首次使用需在 <code>config.js</code> 中填入 GitHub Token。<br>
                    Token 权限:Contents (Read and Write)。
                </div>
            </div>
        </div>
    </div>

    <!-- 编辑弹层 -->
    <div class="modal hidden" id="editModal">
        <div class="modal-content" id="editContent"></div>
    </div>

    <script src="config.js?v=2"></script>
    <script src="data.js?v=2"></script>
    <script src="app.js?v=2"></script>
</body>
</html>
